<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIMS Invoice Management System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon" id="brand-logo">J</div>

            <div>
                <h2 id="brand-name">JIMS</h2>
                <span id="brand-subtitle">Invoice Management</span>
            </div>
        </div>

        <p class="menu-label">MAIN MENU</p>

        <nav>
            <a class="nav-link active" href="#" data-page="dashboard">▦ Dashboard</a>
            <a class="nav-link" href="#" data-page="customers">♙ Customers</a>
            <a class="nav-link" href="#" data-page="products">▣ Products</a>
            <a class="nav-link" href="#" data-page="invoices">▤ Invoices</a>
            <a class="nav-link" href="#" data-page="packing">▧ Packing Lists</a>
            <a class="nav-link" href="#" data-page="analytics">▥ Analytics</a>
        </nav>

        <p class="menu-label settings-label">PREFERENCES</p>

        <nav>
            <a class="nav-link" href="#" data-page="settings">⚙ Settings</a>
        </nav>

        <div class="sidebar-bottom">
            <div class="profile">
                <div class="avatar">A</div>
                <div>
                    <strong>Administrator</strong>
                    <small>System Admin</small>
                </div>
            </div>
        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <header class="topbar">
            <div>
                <h2 id="page-title">Dashboard</h2>
                <p>Welcome back! Here's your business overview.</p>
            </div>

            <div class="top-actions">
                <span class="live-badge">● System Online</span>

                <button class="primary-btn" onclick="showPage('invoices')">
                    + Create Invoice
                </button>
            </div>
        </header>

        <section id="page-content"></section>

        <footer id="app-footer">
            JIMS Invoice Management System © 2026
        </footer>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
